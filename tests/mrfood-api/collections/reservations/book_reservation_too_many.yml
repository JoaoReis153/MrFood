info:
  name: Book reservation exceeding max slots
  type: http
  seq: 3
  tags:
    - Reservations

http:
  method: POST
  url: "{{baseUrl}}/reservations/{{restaurantId}}"
  body:
    type: json
    data: |-
      {
        "time_start": "2026-12-31T11:00:00Z",
        "quantity": 20
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("booking with quantity > 15 returns 400", () => {
          expect([400, 401]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
