info:
  name: Book a reservation
  type: http
  seq: 4
  tags:
    - Reservations

http:
  method: POST
  url: "{{baseUrl}}/reservations/{{restaurantId}}"
  body:
    type: json
    data: |-
      {
        "time_start": "2026-12-31T11:00:00Z",
        "quantity": 2
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const token = bru.getEnvVar("token") || "";
        console.log("[book_reservation] status:", res.status, "| token prefix:", token.substring(0, 30) + "...");

        test("book reservation returns 200", () => {
          expect(res.status).to.equal(200);
        });

        if (res.status === 200) {
          test("response has booking_id", () => {
            expect(res.body).to.have.property("booking_id");
            expect(res.body.booking_id).to.be.a("number").and.be.greaterThan(0);
          });

          bru.setEnvVar("bookingId", String(res.body.booking_id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
