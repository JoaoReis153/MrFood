info:
  name: Delete a reservation
  type: http
  seq: 5
  tags:
    - Reservations

http:
  method: DELETE
  url: "{{baseUrl}}/reservations/{{bookingId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const bookingId = bru.getEnvVar("bookingId");
        if (!bookingId || bookingId === "0" || bookingId === "undefined") {
          // Booking was never created (payment was unavailable or prior step failed).
          test("delete skipped - no booking to delete", () => {
            expect([400, 404]).to.include(res.status);
          });
        } else {
          test("delete reservation returns 200", () => {
            expect(res.status).to.equal(200);
          });
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
