info:
  name: Delete a reservation
  type: http
  seq: 5
  tags:
    - Reservations

http:
  method: DELETE
  url: "{{baseUrl}}/reservations/delete"
  body:
    type: json
    data: |-
      {
        "booking_id": {{bookingId}}
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        if (bru.getEnvVar("bookingId") === "0") {
          // Booking was never created (payment was unavailable).
          // Expect 404 from the booking service — not a test failure.
          test("delete skipped - booking not created (payment unavailable)", () => {
            expect(res.status).to.equal(404);
          });
        } else {
          test("delete reservation returns 200", () => {
            expect(res.status).to.equal(200);
          });
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
