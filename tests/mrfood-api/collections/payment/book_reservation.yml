info:
  name: Book reservation (fixture)
  type: http
  seq: 3
  tags:
    - Payment

http:
  method: POST
  url: "{{baseUrl}}/reservations/{{restaurantId}}"
  body:
    type: json
    data: |-
      {
        "time_start": "2026-12-31T11:00:00Z",
        "quantity": 2
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("book reservation fixture returns 200 or 503 if payment unavailable", () => {
          expect([200, 503]).to.include(res.status);
        });

        if (res.status === 200) {
          bru.setEnvVar("receiptId", String(res.body.payment.receipt_id));
        } else {
          bru.setEnvVar("receiptId", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
