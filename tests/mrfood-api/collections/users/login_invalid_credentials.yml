http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "mrfood.api@gmail.com",
        "password": "WrongPassword999"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("invalid credentials returns 401", () => {
          expect(res.status).to.equal(401);
        });

settings:
