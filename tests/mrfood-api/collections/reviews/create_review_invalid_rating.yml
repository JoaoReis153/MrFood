info:
  name: Create review with invalid rating
  type: http
  seq: 7
  tags:
    - Reviews

http:
  method: POST
  url: "{{baseUrl}}/reviews/{{restaurantId}}"
  body:
    type: json
    data: |-
      {
        "rating": 6,
        "comment": "valid comment"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("rating out of range returns 400", () => {
          expect(res.status).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
